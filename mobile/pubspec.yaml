name: my_terrain
description: Plateforme web et mobile de réservation de terrains de football.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  geolocator: ^13.0.1
  flutter:
    sdk: flutter
  
  # Gestion d'état
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Réseau
  dio: ^5.3.3
  json_annotation: ^4.8.1

  # Navigation
  go_router: ^12.1.1

  # Stockage local (Tokens)
  # UI / Images / Map
  cached_network_image: ^3.3.0
  intl: ^0.18.1
  shared_preferences: ^2.5.5
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
dev_dependencies:
  geolocator: ^13.0.1
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true


